<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - AJAX CRUD</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>StudentHub</h1>
        <p class="subtitle">Student Management Using Fetch API</p>

        <div id="message" role="status"></div>

        <form id="studentForm">
            <input type="hidden" id="studentId">

            <label for="name">Student Name</label>
            <input type="text" id="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" required>

            <label for="course">Course</label>
            <input type="text" id="course" required>

            <button type="submit" id="saveButton">Add Student</button>
            <button type="button" id="cancelButton" hidden>Cancel Edit</button>
        </form>

        <h2>Student Records</h2>

        <p id="loading" hidden>Loading students...</p>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>
        </div>
    </div>

</body>
</html>
